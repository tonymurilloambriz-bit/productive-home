<!DOCTYPE html>
<html lang="en">
<head>
  <a href="index.html" class="home-button">Back to Main Page</a>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Chore Tracker</title>
    <style>
        :root {
            --bg-color: #f7f3ed;
            --container-bg: #fffbf7;
            --primary-brown: #6e5040;
            --accent-tan: #bda38f;
            --light-tan: #e8dfd5;
            --text-color: #4a372c;
            --border-color: #d1c4b9;
            --delete-color: #a96151;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 800px;
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(110, 80, 64, 0.1);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--primary-brown);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
        }

        @media (max-width: 600px) {
            .input-section {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--light-tan);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--primary-brown);
        }

        .form-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input, select {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            color: var(--text-color);
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-brown);
        }

        button {
            background-color: var(--primary-brown);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #573e31;
        }

        .people-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .person-board {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(110, 80, 64, 0.03);
        }

        .person-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--light-tan);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .person-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-brown);
        }

        .btn-delete-person {
            background: none;
            color: var(--delete-color);
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-delete-person:hover {
            background-color: #fcf1ef;
            border-radius: 4px;
        }

        .chore-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chore-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent-tan);
            transition: all 0.2s;
        }

        .chore-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
            border-left-color: var(--border-color);
        }

        .chore-text {
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            margin-right: 8px;
        }

        .btn-delete-chore {
            background: none;
            border: none;
            color: var(--delete-color);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
        }

        .btn-delete-chore:hover {
            background-color: #fcf1ef;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--accent-tan);
            padding: 4px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>🏡 Home Chore Tracker</h1>

        <div class="input-section">
            <!-- Add Person Form -->
            <div class="card">
                <h3>Add Household Member</h3>
                <form id="person-form" class="form-group">
                    <input type="text" id="person-name-input" placeholder="e.g., Sarah" required>
                    <button type="submit">Add</button>
                </form>
            </div>

            <!-- Add Chore Form -->
            <div class="card">
                <h3>Assign a Chore</h3>
                <form id="chore-form">
                    <div class="form-group">
                        <input type="text" id="chore-name-input" placeholder="e.g., Wash dishes" required>
                    </div>
                    <div class="form-group">
                        <select id="chore-assignee-select" required>
                            <option value="" disabled selected>Assign to...</option>
                        </select>
                        <button type="submit">Assign</button>
                    </div>
                </form>
            </div>
        </div>

       
        <div class="people-container" id="people-container">
       
        </div>
    </div>

    <script>
       
        let AppState = {
            people: [],
            chores: []
        };

        
        function loadData() {
            const savedState = localStorage.getItem('homeChoreState');
            if (savedState) {
                AppState = JSON.parse(savedState);
            }
            render();
        }

        
        function saveData() {
            localStorage.setItem('homeChoreState', JSON.stringify(AppState));
            render();
        }

     
        function addPerson(name) {
            const id = 'p_' + Date.now();
            AppState.people.push({ id, name });
            saveData();
        }

        function removePerson(personId) {
            AppState.people = AppState.people.filter(p => p.id !== personId);
            AppState.chores = AppState.chores.filter(c => c.personId !== personId);
            saveData();
        }

        function addChore(text, personId) {
            const id = 'c_' + Date.now();
            AppState.chores.push({ id, text, personId, completed: false });
            saveData();
        }

        function toggleChore(choreId) {
            const chore = AppState.chores.find(c => c.id === choreId);
            if (chore) {
                chore.completed = !chore.completed;
                saveData();
            }
        }

        function removeChore(choreId) {
            AppState.chores = AppState.chores.filter(c => c.id !== choreId);
            saveData();
        }

        
        function render() {
            const container = document.getElementById('people-container');
            const select = document.getElementById('chore-assignee-select');
            
          
            container.innerHTML = '';
            select.innerHTML = '<option value="" disabled selected>Assign to...</option>';

            
            AppState.people.forEach(person => {
                const option = document.createElement('option');
                option.value = person.id;
                option.textContent = person.name;
                select.appendChild(option);
            });

            
            if (AppState.people.length === 0) {
                container.innerHTML = '<div class="empty-state">No household members added yet. Start by adding a person above!</div>';
                return;
            }

            
            AppState.people.forEach(person => {
                const personBoard = document.createElement('div');
                personBoard.className = 'person-board';

                const personHeader = document.createElement('div');
                personHeader.className = 'person-header';
                personHeader.innerHTML = `
                    <span class="person-name">${person.name}</span>
                    <button class="btn-delete-person" onclick="removePerson('${person.id}')">Remove</button>
                `;
                personBoard.appendChild(personHeader);
